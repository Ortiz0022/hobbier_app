
[functions.moderate-message]
enabled = true
verify_jwt = false
import_map = "./functions/moderate-message/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/moderate-message/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/moderate-message/*.html" ]

# Las push salen solo de aquí. verify_jwt se queda en true: la función necesita
# saber QUIÉN pide el envío (comprueba el perfil para los avisos que solo puede
# mandar un administrador), así que una llamada sin sesión no tiene nada que
# hacer. Dentro se vuelve a comprobar con auth.getUser().
[functions.send-push]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-push/index.ts"

[functions.send-invoice]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-invoice/index.ts"
